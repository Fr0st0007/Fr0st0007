<title>Glyphscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&family=Major+Mono+Display&display=swap">
<style>
  /* Layout: full-bleed WebGL character grid; HUD floats over it. Brand top-left, map top-right, keycaps along the bottom. */
  :root {
    --void: #05070d;
    --ink: #eef0f5;
    --ink-dim: #a3abbd;
    --panel: rgba(6, 9, 18, 0.62);
    --edge: rgba(238, 240, 245, 0.16);
    --sun: #ffcf6e;
    --font-display: "Major Mono Display", "Cascadia Code", "Cascadia Mono", ui-monospace, monospace;
    --font-ui: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--void); color: var(--ink); font-family: var(--font-ui); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .hud > * { pointer-events: auto; }
  .top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; backdrop-filter: blur(6px); }
  .brand { display: inline-flex; flex-direction: column; gap: 4px; padding: 10px 14px; min-width: 0; max-width: 100%; }
  .brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.04em; line-height: 1.1; }
  .brand h1 span { color: var(--sun); }
  .readout { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  .readout b { color: var(--ink); font-weight: 600; }
  .mini { padding: 6px; display: flex; flex-direction: column; gap: 4px; align-items: center; flex: none; }
  .mini canvas { width: 132px; height: 132px; image-rendering: pixelated; display: block; border-radius: 2px; }
  .mini small { font-size: 10px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  button { font: 600 12px/1 var(--font-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 9px 11px; cursor: pointer; backdrop-filter: blur(6px); display: inline-flex; gap: 8px; align-items: center; }
  button:hover { border-color: var(--sun); }
  button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--sun); color: var(--sun); }
  kbd { font: 600 10px/1 var(--font-ui); color: var(--void); background: var(--ink-dim); border-radius: 2px; padding: 3px 5px; }
  button[aria-pressed="true"] kbd { background: var(--sun); }
  .hint { font-size: 11px; color: var(--ink-dim); margin-left: auto; padding: 8px 10px; max-width: 100%; }
  #bigmap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 7, 13, 0.55); padding: 16px; }
  #bigmap .frame { padding: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  #bigmap canvas { width: min(78vh, calc(100vw - 52px)); height: min(78vh, calc(100vw - 52px)); image-rendering: pixelated; display: block; }
  #bigmap .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); }
  #jump { display: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); padding: 16px 18px; }
  @media (pointer: coarse) { #jump { display: inline-flex; } }
  @media (max-width: 700px) { .hint { display: none; } .brand h1 { font-size: 18px; } .mini canvas { width: 96px; height: 96px; } }
  #nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>

<canvas id="view" aria-label="Procedurally generated landscape drawn with text characters"></canvas>

<div class="hud top">
  <div class="brand panel">
    <h1>glyph<span>s</span>cape</h1>
    <div class="readout" id="readout">generating world…</div>
  </div>
  <div class="mini panel">
    <canvas id="minimap" width="96" height="96"></canvas>
    <small id="miniScale">1 char = 4 m</small>
  </div>
</div>

<div class="hud bottom">
  <button id="btnLetters" aria-pressed="false"><kbd>L</kbd><span>Show letters</span></button>
  <button id="btnFly" aria-pressed="false"><kbd>F</kbd><span>Fly</span></button>
  <button id="btnMap"><kbd>M</kbd><span>Map</span></button>
  <button id="btnTime"><kbd>T</kbd><span>Skip time</span></button>
  <button id="btnNew"><kbd>R</kbd><span>New world</span></button>
  <button id="btnLess" aria-label="Bigger characters"><kbd>−</kbd><span>Chunkier</span></button>
  <button id="btnMore" aria-label="Smaller characters"><kbd>+</kbd><span>Finer</span></button>
  <div class="hint panel">Click to look · WASD move · Space jump · Shift run · [ ] map zoom · Esc frees mouse</div>
</div>
<button id="jump" class="panel">Jump</button>

<div id="bigmap" hidden>
  <div class="frame panel">
    <canvas id="mapcanvas" width="200" height="200"></canvas>
    <div class="row"><span id="mapScale">1 char = 16 m</span><span>[ ] or scroll to zoom · M to close</span></div>
  </div>
</div>

<div id="nogl" hidden>This needs WebGL 2, which your browser or device has turned off.</div>

<script>
(() => {
  "use strict";

  // =====================================================================
  //  Noise
  // =====================================================================
  let seed = 0, seedMix = 0;
  function setSeed(s) { seed = s >>> 0; seedMix = Math.imul(seed ^ 0x5bd1e995, 0x9E3779B1) | 0; }
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + seedMix) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < oct; i++) {
      sum += amp * vnoise(x, y); norm += amp;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny - 9.1; amp *= 0.5;
    }
    return sum / norm;
  }
  function ridged(x, y, oct) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < oct; i++) {
      const n = 1 - Math.abs(vnoise(x, y) * 2 - 1);
      sum += amp * n * n; norm += amp;
      const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7;
      x = nx + 3.7; y = ny + 11.9; amp *= 0.5;
    }
    return sum / norm;
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const mix = (a, b, t) => a + (b - a) * t;

  // =====================================================================
  //  Terrain: one continent per seed, plus islands and rivers. Units are metres, sea level is 0.
  // =====================================================================
  const R = 3400; // rough continent radius
  function terrainH(x, y) {
    const wx = x + (fbm(x * 0.0004 + 7, y * 0.0004, 3) - 0.5) * 2600;
    const wy = y + (fbm(x * 0.0004, y * 0.0004 - 3, 3) - 0.5) * 2600;
    const d = Math.hypot(wx, wy) / R;
    const c = fbm(x * 0.0011, y * 0.0011, 5);
    const isl = fbm(x * 0.0021 + 40, y * 0.0021 + 40, 4);
    let land = (c - 0.5) + 0.36 * (1 - smooth(0.45, 1.05, d)) - 0.07 - 0.2 * smooth(1.3, 2.1, d);
    land = Math.max(land, ((isl - 0.64) * 1.4) * (1 - smooth(1.5, 2.2, d)));

    let h = land * 150;
    if (land > 0) {
      const mount = smooth(0.1, 0.3, land);
      if (mount > 0) h += mount * Math.pow(ridged(x * 0.0019 + 31.7, y * 0.0019 - 12.3, 5), 1.4) * 180;
      h += (fbm(x * 0.012 + 5, y * 0.012 + 9, 3) - 0.5) * 7 * smooth(0, 6, h);

      // Rivers: thin bands where a low-frequency noise crosses 0.5 carve channels down below sea level.
      const strength = smooth(0.4, 3, h) * (1 - smooth(55, 95, h));
      if (strength > 0) {
        const rv = Math.abs(fbm(x * 0.0009 + 50, y * 0.0009 - 80, 4) - 0.5);
        const w = 0.0065;
        if (rv < w * 6) {
          const valley = 1 - smooth(w, w * 6, rv);
          h = mix(h, h * 0.45 + 1.2, valley * strength);
          const chan = 1 - smooth(w * 0.45, w, rv);
          h = mix(h, -1.8 - (1 - rv / w) * 1.2, chan * strength);
        }
      }
    }
    return h;
  }
  const moisture = (x, y) => fbm(x * 0.0017 + 100, y * 0.0017 - 50, 3);

  // Biomes. Writes rgb into out[0..2] and returns a kind id.
  const K = { WATER: 0, SAND: 1, GRASS: 2, FOREST: 3, PINE: 4, ROCK: 5, SNOW: 6 };
  function classify(h, steep, m, rnd, out) {
    let r, g, b, kind;
    if (h < 0) { // sea or river bed
      const t = clamp(-h / 30, 0, 1);
      r = 170 - 90 * t; g = 156 - 70 * t; b = 112 - 40 * t; kind = K.WATER;
    } else if (h < 1.8) { r = 214; g = 198; b = 146; kind = K.SAND; }
    else if (h > 165 - m * 30 + (rnd - 0.5) * 8) { r = 236; g = 240; b = 248; kind = K.SNOW; }
    else if (h > 120 + m * 10 || steep > 2.4) {
      const t = rnd * 0.2; r = 118 + 30 * t; g = 112 + 25 * t; b = 106 + 20 * t; kind = K.ROCK;
    } else if (m > 0.52 && h < 110) {
      const pine = h > 60 || m > 0.63;
      r = pine ? 52 : 70; g = pine ? 84 : 104; b = pine ? 48 : 44; kind = pine ? K.PINE : K.FOREST;
    } else {
      const dry = clamp((0.52 - m) * 4, 0, 1);
      r = 80 + 80 * dry; g = 150 - 8 * dry; b = 62 - 12 * dry; kind = K.GRASS;
    }
    out[0] = r; out[1] = g; out[2] = b;
    return kind;
  }

  // =====================================================================
  //  Chunk cache. Fine chunks are 1 m per sample (near), coarse are 4 m (far).
  // =====================================================================
  const CS = 128;
  const LODS = [{ step: 1, map: new Map() }, { step: 4, map: new Map() }];
  const tmp = [0, 0, 0];

  function genChunk(cx, cy, step, coarse) {
    const x0 = cx * CS, y0 = cy * CS, N = CS + 1;
    const hh = new Float32Array(N * N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) hh[j * N + i] = terrainH((x0 + i - 1) * step, (y0 + j - 1) * step);
    const n = CS * CS;
    const ch = { x0, y0, h: new Float32Array(n), floor: new Float32Array(n), col: new Uint8Array(n * 3), kind: new Uint8Array(n), jit: new Uint8Array(n) };
    for (let j = 0; j < CS; j++) {
      for (let i = 0; i < CS; i++) {
        const k = j * CS + i, gx = x0 + i, gy = y0 + j;
        const h = hh[(j + 1) * N + i + 1];
        const sx = (h - hh[(j + 1) * N + i]) / step, sy = (h - hh[j * N + i + 1]) / step;
        const steep = Math.abs(sx) + Math.abs(sy);
        const rnd = hash2(gx * step, gy * step), rnd2 = hash2(gy * step + 7, gx * step - 3);
        const kind = classify(h, steep, moisture(gx * step, gy * step), rnd, tmp);
        // light comes from the sun's side (-x, -y)
        let shade = kind === K.WATER ? 1 : clamp(1 + (sx + sy) * 0.55, 0.5, 1.45);
        let top = h;
        if (coarse && (kind === K.FOREST || kind === K.PINE)) { top += 6 + rnd2 * 8; shade *= 0.72 + rnd2 * 0.3; }
        const v = 0.92 + rnd2 * 0.16;
        ch.h[k] = Math.max(top, 0);
        ch.floor[k] = h;
        ch.col[k * 3] = clamp(tmp[0] * shade * v, 0, 255);
        ch.col[k * 3 + 1] = clamp(tmp[1] * shade * v, 0, 255);
        ch.col[k * 3 + 2] = clamp(tmp[2] * shade * v, 0, 255);
        ch.kind[k] = kind;
        ch.jit[k] = (rnd * 255) | 0;
      }
    }
    return ch;
  }
  function chunkAt(lod, cx, cy) {
    const L = LODS[lod], key = cx * 65536 + cy;
    let ch = L.map.get(key);
    if (!ch) { ch = genChunk(cx, cy, L.step, lod === 1); L.map.set(key, ch); }
    return ch;
  }
  function pruneChunks() {
    for (let lod = 0; lod < 2; lod++) {
      const L = LODS[lod], keep = lod ? 5 : 6;
      if (L.map.size < (lod ? 90 : 140)) continue;
      const pcx = Math.floor(cam.x / L.step / CS), pcy = Math.floor(cam.y / L.step / CS);
      for (const [key, ch] of L.map) {
        if (Math.abs(ch.x0 / CS - pcx) > keep || Math.abs(ch.y0 / CS - pcy) > keep) L.map.delete(key);
      }
    }
  }
  // Fine-grid lookups.
  function fineIdx(ix, iy) {
    const ch = chunkAt(0, Math.floor(ix / CS), Math.floor(iy / CS));
    fineIdx.ch = ch;
    return (iy - ch.y0) * CS + (ix - ch.x0);
  }
  function floorAt(x, y) { // smooth ground height (river/sea bed included)
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    let k = fineIdx(ix, iy); const a = fineIdx.ch.floor[k];
    k = fineIdx(ix + 1, iy); const b = fineIdx.ch.floor[k];
    k = fineIdx(ix, iy + 1); const c = fineIdx.ch.floor[k];
    k = fineIdx(ix + 1, iy + 1); const d = fineIdx.ch.floor[k];
    return mix(mix(a, b, fx), mix(c, d, fx), fy);
  }
  function kindAt(x, y) { const k = fineIdx(Math.floor(x), Math.floor(y)); return fineIdx.ch.kind[k]; }

  // =====================================================================
  //  Trees & bushes: placed on a jittered lattice; they have collision and are drawn as 3D sprites.
  // =====================================================================
  const TS = 5;
  const T_OAK = 1, T_PINE = 2, T_BUSH = 3;
  const treeOut = { x: 0, y: 0, z: 0, type: 0, h: 0, w: 0, r: 0, seed: 0 };
  function treeAt(i, j) {
    const r1 = hash2(i * 3 + 1, j * 7 - 2), r2 = hash2(i * 11 - 5, j * 3 + 8), r3 = hash2(i - 9, j + 13);
    const x = (i + 0.15 + 0.7 * r1) * TS, y = (j + 0.15 + 0.7 * r2) * TS;
    const kind = kindAt(x, y);
    let type = 0;
    if (kind === K.FOREST) type = r3 < 0.55 ? T_OAK : r3 < 0.62 ? T_PINE : r3 < 0.8 ? T_BUSH : 0;
    else if (kind === K.PINE) type = r3 < 0.6 ? T_PINE : r3 < 0.7 ? T_BUSH : 0;
    else if (kind === K.GRASS) type = r3 < 0.025 ? T_OAK : r3 < 0.1 ? T_BUSH : 0;
    if (!type) return null;
    const z = floorAt(x, y);
    if (z < 0.4) return null;
    const v = hash2(j * 5 + 3, i * 13 - 1);
    treeOut.x = x; treeOut.y = y; treeOut.z = z; treeOut.type = type; treeOut.seed = v;
    if (type === T_OAK) { treeOut.h = 7 + v * 5; treeOut.w = treeOut.h * 0.85; treeOut.r = 0.45; }
    else if (type === T_PINE) { treeOut.h = 10 + v * 8; treeOut.w = treeOut.h * 0.42; treeOut.r = 0.35; }
    else { treeOut.h = 0.8 + v * 0.8; treeOut.w = treeOut.h * 1.9; treeOut.r = 0; }
    return treeOut;
  }

  // =====================================================================
  //  Grid + WebGL
  // =====================================================================
  const view = document.getElementById("view");
  const gl = view.getContext("webgl2", { antialias: false, alpha: false });
  if (!gl) { document.getElementById("nogl").hidden = false; return; }

  // Glyphs ordered from emptiest to densest; each cell picks one by its brightness.
  const RAMP = " .`',:;-~=+*!ixo%#&8@";
  const FONT_SIZES = [5, 6, 7, 8, 10, 12, 15];
  let detail = 2;
  let dpr = 1, W = 0, H = 0, cw = 4, chh = 8, cols = 0, rows = 0;
  let cellData, cellDepth, cellJit;
  let cellTex, atlasTex;

  const VS = `#version 300 es
  in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
  const FS = `#version 300 es
  precision highp float;
  uniform sampler2D uCells, uAtlas;
  uniform vec2 uCell, uRes;
  uniform float uGlyphs, uReveal;
  out vec4 o;
  void main(){
    vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
    vec2 cell = floor(p / uCell);
    vec2 f = (p - cell * uCell) / uCell;
    vec4 d = texelFetch(uCells, ivec2(cell), 0);
    float g = floor(d.a * 255. + .5);
    float m = texture(uAtlas, vec2((g + f.x) / uGlyphs, f.y)).a;
    vec3 c = d.rgb;
    vec3 bg = c * mix(.92, .05, uReveal);
    vec3 fg = min(c * mix(1.07, 1.4, uReveal) + mix(.01, .05, uReveal), 1.);
    o = vec4(mix(bg, fg, m), 1.);
  }`;
  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const uCells = U("uCells"), uAtlas = U("uAtlas"), uCell = U("uCell"), uRes = U("uRes"), uGlyphs = U("uGlyphs"), uReveal = U("uReveal");

  function makeTex() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function buildGrid() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr);
    view.width = W; view.height = H;
    gl.viewport(0, 0, W, H);

    const fs = FONT_SIZES[detail] * dpr;
    const font = `${fs}px "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace`;
    const a = document.createElement("canvas").getContext("2d");
    a.font = font;
    cw = Math.max(2, Math.round(a.measureText("M").width));
    chh = Math.max(4, Math.round(fs * 1.2));
    cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);

    a.canvas.width = cw * RAMP.length; a.canvas.height = chh;
    a.font = font; a.fillStyle = "#fff"; a.textBaseline = "middle"; a.textAlign = "center";
    [...RAMP].forEach((g, i) => { if (i) a.fillText(g, i * cw + cw / 2, chh / 2 + dpr * 0.5); });

    if (!atlasTex) { atlasTex = makeTex(); cellTex = makeTex(); }
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, a.canvas);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cellTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

    gl.uniform1i(uCells, 0); gl.uniform1i(uAtlas, 1);
    gl.uniform2f(uCell, cw, chh); gl.uniform2f(uRes, W, H); gl.uniform1f(uGlyphs, RAMP.length);

    cellData = new Uint8Array(cols * rows * 4);
    cellDepth = new Float32Array(cols * rows);
    cellJit = new Uint8Array(cols * rows);
  }

  // =====================================================================
  //  Player / camera
  // =====================================================================
  const EYE = 1.7;
  const cam = { x: 0, y: 0, z: 10, a: 0.6, pitch: 0, vz: 0, fly: false, grounded: false, swimming: false };
  let tod = 0.36;
  let letters = 0, lettersTarget = 0, clock = 0, mainland = 0;

  function findStart() {
    // Walk outward from the middle of the continent until we find dry, gentle ground near some trees.
    for (let i = 0; i < 400; i++) {
      const ang = i * 2.399, rad = 40 + i * 9;
      const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
      const h = terrainH(x, y);
      if (h < 4 || h > 45) continue;

    const end = Math.min(N, m.row + rowsPerFrame);
    for (let j = m.row; j < end; j++) {
      for (let i = 0; i < N; i++) {

  const keys = new Set();

  addEventListener("keydown", ev => {

  bigWrap.addEventListener("wheel", ev => { zoomMap(ev.deltaY > 0 ? 1 : -1); ev.preventDefault(); }, { passive: false });
  mini.parentElement.addEventListener("click", toggleMap);

  const look = (dx, dy) => { cam.a += dx * 0.0035; cam.pitch = clamp(cam.pitch - dy * 0.0025, -0.6, 0.6); };
  addEventListener("mousemove", ev => { if (document.pointerLockElement === view) look(ev.movementX, ev.movementY); });

  // Pointer: mouse clicks lock the pointer (drag-to-look fallback); touch uses left half to move, right half to look.
  const touches = new Map();
  let joyX = 0, joyY = 0;
  view.addEventListener("pointerdown", ev => {
    if (ev.pointerType === "mouse") {
      try { const p = view.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* not allowed here */ }
    }
    touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, move: ev.pointerType === "touch" && ev.clientX < innerWidth / 2 });
    view.setPointerCapture(ev.pointerId);
  });
  view.addEventListener("pointermove", ev => {
    const t = touches.get(ev.pointerId);
    if (!t || document.pointerLockElement === view) return;
    if (t.move) {
      joyX = clamp((ev.clientX - t.sx) / 50, -1, 1); joyY = clamp((t.sy - ev.clientY) / 50, -1, 1);
    } else look((ev.clientX - t.x) * (ev.pointerType === "touch" ? 1.4 : 1), (ev.clientY - t.y) * (ev.pointerType === "touch" ? 1.4 : 1));
    t.x = ev.clientX; t.y = ev.clientY;
  });
  const endTouch = ev => { const t = touches.get(ev.pointerId); if (t && t.move) { joyX = 0; joyY = 0; } touches.delete(ev.pointerId); };
  view.addEventListener("pointerup", endTouch);
  view.addEventListener("pointercancel", endTouch);
  const jumpBtn = document.getElementById("jump");
  jumpBtn.addEventListener("pointerdown", () => keys.add(" "));
  jumpBtn.addEventListener("pointerup", () => keys.delete(" "));
  jumpBtn.addEventListener("pointerleave", () => keys.delete(" "));

  // =====================================================================
  //  Simulation
  // =====================================================================
  function collideTrees() {
    const ci = Math.floor(cam.x / TS), cj = Math.floor(cam.y / TS);
    for (let j = cj - 1; j <= cj + 1; j++) for (let i = ci - 1; i <= ci + 1; i++) {
      const tr = treeAt(i, j);
      if (!tr || !tr.r) continue;
      if (cam.z < tr.z + EYE - 0.5 || cam.z > tr.z + tr.h * 0.6 + EYE) continue;
      const dx = cam.x - tr.x, dy = cam.y - tr.y, d = Math.hypot(dx, dy), min = tr.r + 0.35;
      if (d < min && d > 1e-4) { cam.x = tr.x + dx / d * min; cam.y = tr.y + dy / d * min; }
    }
  }

  function step(dt) {
    clock += dt;
    tod = (tod + dt / 300) % 1; // a day every five minutes
    letters += (lettersTarget - letters) * Math.min(1, dt * 5);

    let fwd = joyY, strafe = joyX, turn = 0;
    if (keys.has("w") || keys.has("arrowup")) fwd += 1;
    if (keys.has("s") || keys.has("arrowdown")) fwd -= 1;
    if (keys.has("d")) strafe += 1;
    if (keys.has("a")) strafe -= 1;
    if (keys.has("arrowleft")) turn -= 1;
    if (keys.has("arrowright")) turn += 1;
    cam.a += turn * 1.8 * dt;
    const len = Math.hypot(fwd, strafe);
    if (len > 1) { fwd /= len; strafe /= len; }
    const run = keys.has("shift");

    const ground = floorAt(cam.x, cam.y);
    cam.swimming = !cam.fly && ground < -1.1;
    const speed = cam.fly ? (run ? 90 : 28) : cam.swimming ? (run ? 3.2 : 2) : (run ? 9 : 4.5);
    const fx = Math.cos(cam.a), fy = Math.sin(cam.a);
    cam.x += (fx * fwd - fy * strafe) * speed * dt;
    cam.y += (fy * fwd + fx * strafe) * speed * dt;

    if (cam.fly) {
      let lift = 0;
      if (keys.has(" ") || keys.has("e")) lift += 1;
      if (keys.has("c") || keys.has("q")) lift -= 1;
      cam.z += lift * (run ? 60 : 22) * dt;
      cam.z = clamp(cam.z, Math.max(floorAt(cam.x, cam.y), 0) + EYE, 600);
      return;
    }
    collideTrees();
    const g2 = floorAt(cam.x, cam.y);
    if (cam.swimming) {
      // float with the eye just above the surface, bobbing a little
      const target = 0.35 + Math.sin(clock * 2) * 0.06;
      cam.z += (target - cam.z) * Math.min(1, dt * 4);
      cam.vz = 0;
      cam.z = Math.max(cam.z, g2 + EYE * 0.6);
      return;
    }
    cam.vz -= 20 * dt;
    if (keys.has(" ") && cam.grounded) { cam.vz = 6.5; cam.grounded = false; }
    cam.z += cam.vz * dt;
    const feet = Math.max(g2, -1.1) + EYE;
    if (cam.z <= feet) { cam.z = feet; cam.vz = 0; cam.grounded = true; }
    else if (cam.z - feet > 0.2) cam.grounded = false;
  }

  const COMPASS = ["E", "SE", "S", "SW", "W", "NW", "N", "NE"];
  function updateReadout() {
    const ang = ((cam.a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const dir = COMPASS[Math.round(ang / (Math.PI / 4)) % 8];
    const mins = Math.floor(tod * 24 * 60);
    const hh = String(Math.floor(mins / 60)).padStart(2, "0"), mm = String(mins % 60).padStart(2, "0");
    const mode = cam.fly ? "flying" : cam.swimming ? "swimming" : "on foot";
    readout.innerHTML =
      `seed <b>${seed}</b> · <b>${hh}:${mm}</b> · facing <b>${dir}</b> · ${mode}\n` +
      `elev <b>${Math.round(cam.z - EYE)}</b> m · mainland <b>${mainland.toFixed(0)}</b> km² (${(mainland * 0.386).toFixed(0)} mi²) · ${cols}×${rows} chars`;
    document.getElementById("miniScale").textContent = fmtScale(MAP_ZOOMS[miniZoom]);
    document.getElementById("mapScale").textContent = `1 char = ${MAP_ZOOMS[bigZoom]} m · ${(MAP_ZOOMS[bigZoom] * 200 / 1000).toFixed(1)} km across`;
  }
  const readout = document.getElementById("readout");

  // =====================================================================
  //  Boot
  // =====================================================================
  let last = performance.now(), slow = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    step(dt);
    updateLight();
    const t0 = performance.now();
    render();
    window.glyphscape.ms = performance.now() - t0;
    updateMap(maps[0], 12);
    drawMap(maps[0]);
    if (!bigWrap.hidden) { updateMap(maps[1], 14); drawMap(maps[1]); }
    if ((slow -= dt) <= 0) { updateReadout(); pruneChunks(); slow = 0.25; }
    requestAnimationFrame(frame);
  }
  function start(data) {
    if (data && data.seed != null) {
      setSeed(data.seed); Object.assign(cam, data.cam); tod = data.tod; detail = data.detail ?? detail; mainland = measureMainland();
    } else newWorld();
    buildGrid();
    setFly(cam.fly);
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ seed, cam: { ...cam }, tod, detail }));
  addEventListener("resize", buildGrid);
  window.glyphscape = { terrainH, cam, get seed() { return seed; } };

  const boot = () => (window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
  Promise.race([
    document.fonts ? document.fonts.load('16px "Cascadia Code"') : Promise.resolve(),
    new Promise(r => setTimeout(r, 1200)),
  ]).then(boot, boot);
})();
</script>
